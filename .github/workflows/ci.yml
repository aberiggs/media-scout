name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Main pushes are serialized without canceling the active run: a newer successful
# run can replace dev only after any older publish has completed. PR runs cancel
# superseded work for the same ref.
concurrency:
  group: media-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      runtime_change: ${{ steps.classify.outputs.runtime_change }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail_closed() {
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'runtime_change=false' >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push ]]; then
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$CURRENT_SHA"
          else
            base_sha=""
            head_sha=""
          fi

          # Compare only event-provided commit IDs with built-in git. Invalid,
          # unavailable, or empty diffs conservatively require a container build.
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || ! "$head_sha" =~ ^[0-9a-f]{40}$ || "$base_sha" =~ ^0+$ || "$head_sha" =~ ^0+$ ]]; then
            fail_closed
            exit 0
          fi
          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null || ! git cat-file -e "$head_sha^{commit}" 2>/dev/null; then
            fail_closed
            exit 0
          fi

          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT
          if ! git diff --name-only --no-renames -z "$base_sha" "$head_sha" > "$changed_paths" || [[ ! -s "$changed_paths" ]]; then
            fail_closed
            exit 0
          fi

          docs_only=true
          runtime_change=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|*.md) ;;
              *)
                docs_only=false
                runtime_change=true
                ;;
            esac
          done < "$changed_paths"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "runtime_change=$runtime_change" >> "$GITHUB_OUTPUT"

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked frontend dependencies
        run: npm run web:install

      - name: Frontend typecheck
        run: npm --prefix web run typecheck

      - name: Frontend tests
        run: npm --prefix web test

      - name: Build frontend bundle
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  container-build-matrix:
    name: container-build / ${{ matrix.platform }}
    needs: [checks, changes]
    if: always() && needs.checks.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # docker/setup-qemu-action v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action v4

      - name: Build and load ${{ matrix.platform }} image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: media-agent:ci-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Smoke-test SQLite native addon
        run: >-
          docker run --rm --platform ${{ matrix.platform }} --entrypoint node
          media-agent:ci-${{ matrix.suffix }}
          --input-type=module -e 'import Database from "better-sqlite3";
          const db = new Database(":memory:");
          if (db.prepare("SELECT 1 AS value").get().value !== 1) process.exit(1);
          db.close();'

  container-build:
    name: container-build
    if: always()
    needs: [checks, changes, container-build-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require checks, detection, and the appropriate build outcome
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          MATRIX_RESULT: ${{ needs.container-build-matrix.result }}
        run: |
          set -euo pipefail
          test "$CHECKS_RESULT" = success
          test "$CHANGES_RESULT" = success
          if [[ "$DOCS_ONLY" == true ]]; then
            test "$MATRIX_RESULT" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$MATRIX_RESULT" = success
          fi
        shell: bash

  publish-dev:
    name: publish-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && needs.changes.outputs.runtime_change == 'true' && needs.checks.result == 'success' && needs.container-build-matrix.result == 'success' && needs.container-build.result == 'success'
    needs: [checks, changes, container-build-matrix, container-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # docker/setup-qemu-action v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action v4

      - name: Warm multi-platform build cache (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Verify this run is still the current main commit
        id: current-main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/commits/main")"
          head_sha="$(jq -er '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$response")"
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "Main has advanced since this run; skipping all publish steps."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Lowercase GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Log in to GHCR
        if: steps.current-main.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # docker/login-action v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dev and commit-addressed SHA tags
        id: meta
        if: steps.current-main.outputs.publish == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # docker/metadata-action v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=dev
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and publish multi-platform dev image
        if: steps.current-main.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
